<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión</title>
</head>
<body>
  <h1>Gestión de casas</h1>
  <p>Esta página la sirve Nginx. Los datos los da la API, a través del mismo Nginx.</p>
  <button id="cargar">Cargar grandes casas</button>
  <pre id="salida"></pre>
  <script>
    document.getElementById('cargar').addEventListener('click', async () => {
      const salida = document.getElementById('salida');
      const respuesta = await fetch('/api/gran-casa');
      const texto = await respuesta.text();
      let cuerpo = texto;
      try { cuerpo = JSON.stringify(JSON.parse(texto), null, 2); } catch (e) {}
      salida.textContent = respuesta.status + '\n\n' + cuerpo;
    });
  </script>
</body>
</html>
